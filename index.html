<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Golf Coach" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>Golf Practice Coach</title>
  <style>
    :root{
      --bg:#f3f4f6;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;
      --accent:#111827;--good:#e5f6ea;--mid:#fff7d6;--bad:#fde7e7;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
    .app{max-width:680px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 88px)}
    h1{font-size:24px;margin:6px 0 2px}
    .sub{color:var(--muted);font-size:13px;margin-bottom:12px}
    .card{background:var(--card);border-radius:18px;padding:14px;margin:12px 0;box-shadow:0 1px 2px rgba(0,0,0,.06)}
    .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .between{justify-content:space-between}
    button,input,textarea{font:inherit}
    button{border:0;border-radius:12px;padding:12px 14px;background:#e5e7eb;color:#111827;font-weight:700}
    button.primary{background:var(--accent);color:#fff}
    button.danger{background:#fee2e2;color:#991b1b}
    button.small{padding:8px 10px;font-size:13px}
    input[type="number"],input[type="text"]{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;color:var(--text)}
    input[type="number"]{width:90px}
    input[type="text"]{flex:1;min-width:150px}
    .club-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
    .club-tabs button{flex:0 0 auto;min-width:64px}
    .club-tabs button.active{background:#111827;color:white}
    .recording-head{background:#eff6ff;border:2px solid #bfdbfe;border-radius:16px;padding:12px;margin-top:10px}
    .recording-label{font-size:12px;color:#1e40af;font-weight:700}
    .recording-value{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
    .recording-club{font-size:clamp(26px,8vw,38px);font-weight:800;overflow-wrap:anywhere}
    .recording-count{font-size:clamp(28px,9vw,42px);font-weight:800;font-variant-numeric:tabular-nums}
    .recording-count small{font-size:16px}
    .shot-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
    .shot-grid button{min-width:0;min-height:clamp(58px,11dvh,86px);padding:8px 3px;font-size:clamp(14px,4vw,20px);white-space:nowrap;touch-action:manipulation}
    .shot-grid .good{background:var(--good)}
    .shot-grid .mid{background:var(--mid)}
    .shot-grid .bad{background:var(--bad)}
    .stat{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
    .stat:last-child{border:0}
    .stat-count{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
    .stat-count small{font-size:13px}
    .muted{color:var(--muted)}
    .progress{height:12px;background:#e5e7eb;border-radius:99px;overflow:hidden}
    .progress>div{height:100%;background:#111827;width:0}
    textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:12px;padding:10px}
    .history-item{border-top:1px solid var(--line);padding:10px 0}
    .history-item:first-child{border-top:0}
    .bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px max(12px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
    .bottom-inner{max-width:680px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
    .pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#f3f4f6;font-size:12px}
    .hidden{display:none!important}
    .report{white-space:pre-wrap;background:#f9fafb;padding:12px;border-radius:12px;font-size:14px}
    .install-tip{font-size:13px;color:#374151;background:#eef2ff;border-radius:12px;padding:10px}
    .club-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
    .club-item{display:grid;grid-template-columns:auto 1fr auto auto auto;gap:6px;align-items:center}
    .drag{color:var(--muted);font-weight:700}
    .section-title{font-weight:700;margin-bottom:8px}
    .quick-targets{display:flex;gap:6px;flex-wrap:wrap}
  </style>
</head>
<body>
<div class="app">
  <h1>Golf Practice Coach</h1>
  <div class="sub">球数もクラブも自由に設定して、1球1タップで記録</div>

  <div class="install-tip" id="installTip">
    iPhoneではSafariの共有ボタン →「ホーム画面に追加」でアプリのように使えます。
  </div>

  <section id="practiceView">
    <div class="card">
      <div class="row between">
        <strong>今日の練習</strong>
        <span class="pill" id="countPill">0 / 100球</span>
      </div>
      <div class="progress" style="margin:10px 0 4px"><div id="progressBar"></div></div>
      <div class="muted" id="lastShot">まだ記録はありません</div>
    </div>

    <div class="card">
      <div class="row between">
        <strong>使用クラブ</strong>
        <button class="small" id="openClubManagerBtn">クラブ設定</button>
      </div>
      <div class="club-tabs" id="clubTabs" style="margin-top:10px"></div>
      <div class="recording-head" aria-live="polite" aria-atomic="true">
        <div class="recording-label">選択中のクラブ・今日の球数</div>
        <div class="recording-value">
          <span class="recording-club" id="selectedClubName">7I</span>
          <span class="recording-count"><span id="selectedClubCount">0</span><small> 球</small></span>
        </div>
      </div>
      <div class="shot-grid" aria-label="ショットの記録">
        <button class="good" data-dir="左" data-contact="良">左・良</button>
        <button class="good" data-dir="中央" data-contact="良">中央・良</button>
        <button class="good" data-dir="右" data-contact="良">右・良</button>
        <button class="mid" data-dir="左" data-contact="普通">左・普通</button>
        <button class="mid" data-dir="中央" data-contact="普通">中央・普通</button>
        <button class="mid" data-dir="右" data-contact="普通">右・普通</button>
        <button class="bad" data-dir="左" data-contact="悪">左・悪</button>
        <button class="bad" data-dir="中央" data-contact="悪">中央・悪</button>
        <button class="bad" data-dir="右" data-contact="悪">右・悪</button>
        <button class="danger" data-special="トップ">トップ</button>
        <button class="danger" data-special="ダフリ">ダフリ</button>
        <button class="danger" data-special="シャンク">シャンク</button>
      </div>
      <div class="row" style="margin-top:10px">
        <button class="small" id="undoBtn">直前を取消</button>
        <button class="small" id="resetTodayBtn">今日をリセット</button>
      </div>
    </div>

    <div class="card">
      <div class="section-title">目標球数</div>
      <div class="row">
        <input id="targetInput" type="number" min="1" max="999" step="1" inputmode="numeric" />
        <span class="muted">球</span>
      </div>
      <div class="quick-targets" style="margin-top:8px">
        <button class="small targetQuick" data-target="50">50</button>
        <button class="small targetQuick" data-target="80">80</button>
        <button class="small targetQuick" data-target="100">100</button>
        <button class="small targetQuick" data-target="120">120</button>
        <button class="small targetQuick" data-target="150">150</button>
      </div>
      <div class="muted" style="margin-top:8px;font-size:12px">途中で変更しても記録はそのまま残ります。</div>
    </div>

    <div class="card hidden" id="clubManager">
      <div class="row between">
        <strong>クラブ設定</strong>
        <button class="small" id="closeClubManagerBtn">閉じる</button>
      </div>
      <div class="row" style="margin-top:10px">
        <input id="newClubInput" type="text" placeholder="例：5W、6I、SW、58°" />
        <button id="addClubBtn" class="primary">追加</button>
      </div>
      <div class="club-list" id="clubList"></div>
      <div class="muted" style="margin-top:8px;font-size:12px">
        ↑↓で並び替えできます。記録済みのクラブを削除しても過去データは残ります。
      </div>
    </div>

    <div class="card">
      <strong>クラブ別集計</strong>
      <div id="stats"></div>
    </div>

    <div class="card">
      <strong>今日の感覚メモ</strong>
      <textarea id="memo" placeholder="例：UTは8割だと当たりやすい。Driverは頭を残すと良かった。"></textarea>
    </div>
  </section>

  <section id="reportView" class="hidden">
    <div class="card">
      <div class="row between">
        <strong>ChatGPT用レポート</strong>
        <button class="small" id="refreshReportBtn">更新</button>
      </div>
      <div id="reportText" class="report" style="margin-top:10px"></div>
      <div class="row" style="margin-top:10px">
        <button id="copyBtn">コピー</button>
        <button id="shareBtn" class="primary">共有</button>
        <button id="saveSessionBtn">練習を保存</button>
      </div>
    </div>
  </section>

  <section id="historyView" class="hidden">
    <div class="card">
      <div class="row between">
        <strong>練習履歴</strong>
        <button class="small danger" id="clearHistoryBtn">履歴削除</button>
      </div>
      <div id="historyList"></div>
    </div>
  </section>
</div>

<div class="bottom">
  <div class="bottom-inner">
    <button data-view="practiceView" class="primary navBtn">記録</button>
    <button data-view="reportView" class="navBtn">レポート</button>
    <button data-view="historyView" class="navBtn">履歴</button>
  </div>
</div>

<script>
const DEFAULT_CLUBS = ["AW","PW","7I","4UT","Driver"];
let state = JSON.parse(localStorage.getItem("golfState") || "null") || {
  selectedClub:"7I", shots:[], memo:"", target:100
};
if(!state.target || state.target < 1) state.target = 100;

let clubs = JSON.parse(localStorage.getItem("golfClubs") || "null") || DEFAULT_CLUBS.slice();
if(!Array.isArray(clubs) || !clubs.length) clubs = DEFAULT_CLUBS.slice();
if(!clubs.includes(state.selectedClub)) state.selectedClub = clubs[0];

let history = JSON.parse(localStorage.getItem("golfHistory") || "[]");

function save(){
  localStorage.setItem("golfState", JSON.stringify(state));
  localStorage.setItem("golfClubs", JSON.stringify(clubs));
}
function saveHistory(){ localStorage.setItem("golfHistory", JSON.stringify(history)); }

function renderTabs(){
  const el=document.getElementById("clubTabs"); el.innerHTML="";
  clubs.forEach(c=>{
    const b=document.createElement("button"); b.textContent=c;
    if(c===state.selectedClub)b.classList.add("active");
    b.onclick=()=>{state.selectedClub=c;save();renderTabs();renderSelectedClub();}
    el.appendChild(b);
  });
}

function addShot(dir, contact, special){
  if(!state.selectedClub){ alert("クラブを1つ追加してください"); return; }
  state.shots.push({
    ts:Date.now(), club:state.selectedClub,
    dir:dir||"", contact:contact||"", special:special||""
  });
  save(); renderAll();
}

document.querySelectorAll("[data-dir]").forEach(b=>{
  b.onclick=()=>addShot(b.dataset.dir,b.dataset.contact,"");
});
document.querySelectorAll("[data-special]").forEach(b=>{
  b.onclick=()=>addShot("","",b.dataset.special);
});

function clubStats(club){
  const s=state.shots.filter(x=>x.club===club);
  const n=s.length;
  const good=s.filter(x=>x.contact==="良").length;
  const center=s.filter(x=>x.dir==="中央").length;
  const left=s.filter(x=>x.dir==="左").length;
  const right=s.filter(x=>x.dir==="右").length;
  const top=s.filter(x=>x.special==="トップ").length;
  const fat=s.filter(x=>x.special==="ダフリ").length;
  const shank=s.filter(x=>x.special==="シャンク").length;
  return {n,good,center,left,right,top,fat,shank};
}

function pct(a,b){return b?Math.round(a/b*100):0}

function getAllUsedClubs(){
  const fromShots=[...new Set(state.shots.map(x=>x.club))];
  return [...new Set([...clubs,...fromShots])];
}

function renderSelectedClub(){
  document.getElementById("selectedClubName").textContent=state.selectedClub||"未選択";
  document.getElementById("selectedClubCount").textContent=state.selectedClub?clubStats(state.selectedClub).n:0;
}

function renderStats(){
  const el=document.getElementById("stats"); el.innerHTML="";
  const displayClubs=getAllUsedClubs();
  if(!displayClubs.length){
    el.innerHTML='<div class="muted" style="padding:12px 0">クラブを追加してください</div>';
    return;
  }
  displayClubs.forEach(c=>{
    const s=clubStats(c);
    const d=document.createElement("div"); d.className="stat";
    d.innerHTML=`
      <div><strong>${escapeHtml(c)}</strong></div><div class="stat-count">${s.n}<small> 球</small></div>
      <div class="muted">中央率 / 良い当たり率</div><div>${pct(s.center,s.n)}% / ${pct(s.good,s.n)}%</div>
      <div class="muted">左 ${s.left}・右 ${s.right}・トップ ${s.top}・ダフリ ${s.fat}・シャンク ${s.shank}</div><div></div>`;
    el.appendChild(d);
  });
}

function renderProgress(){
  const n=state.shots.length;
  document.getElementById("countPill").textContent=`${n} / ${state.target}球`;
  document.getElementById("progressBar").style.width=Math.min(100,n/state.target*100)+"%";
  const last=state.shots[state.shots.length-1];
  document.getElementById("lastShot").textContent=last
    ? `直前：${last.club} ${last.special || (last.dir+"・"+last.contact)}`
    : "まだ記録はありません";
  document.getElementById("targetInput").value=state.target;
}

function buildReport(){
  const date=new Date().toLocaleDateString("ja-JP");
  let out=`${date} ゴルフ練習\n`;
  out+=`総球数 ${state.shots.length}球 / 目標 ${state.target}球\n\n`;
  getAllUsedClubs().forEach(c=>{
    const s=clubStats(c);
    if(!s.n)return;
    out+=`${c} ${s.n}球\n`;
    out+=`中央 ${s.center} / 左 ${s.left} / 右 ${s.right}\n`;
    out+=`良い当たり ${s.good}/${s.n} (${pct(s.good,s.n)}%)\n`;
    if(s.top||s.fat||s.shank) out+=`トップ ${s.top} / ダフリ ${s.fat} / シャンク ${s.shank}\n`;
    out+="\n";
  });
  out+=`感覚メモ\n${state.memo || "なし"}\n\n`;
  out+=`この記録を前回までの傾向と比較して、改善点を1つに絞り、次回の練習メニューを目標球数に合わせて作ってください。`;
  return out;
}

function renderReport(){document.getElementById("reportText").textContent=buildReport();}

function renderHistory(){
  const el=document.getElementById("historyList"); el.innerHTML="";
  if(!history.length){el.innerHTML='<div class="muted" style="padding:12px 0">保存済みの練習はありません</div>';return}
  [...history].reverse().forEach(item=>{
    const d=document.createElement("div"); d.className="history-item";
    d.innerHTML=`<strong>${escapeHtml(item.date)}</strong> <span class="pill">${item.total}球</span>
      <div class="muted" style="margin-top:4px">${escapeHtml(item.memo || "メモなし")}</div>`;
    el.appendChild(d);
  });
}

function renderClubManager(){
  const el=document.getElementById("clubList"); el.innerHTML="";
  clubs.forEach((club,idx)=>{
    const row=document.createElement("div"); row.className="club-item";
    row.innerHTML=`
      <div class="drag">${idx+1}</div>
      <div><strong>${escapeHtml(club)}</strong></div>
      <button class="small" ${idx===0?"disabled":""}>↑</button>
      <button class="small" ${idx===clubs.length-1?"disabled":""}>↓</button>
      <button class="small danger">削除</button>`;
    const buttons=row.querySelectorAll("button");
    buttons[0].onclick=()=>moveClub(idx,-1);
    buttons[1].onclick=()=>moveClub(idx,1);
    buttons[2].onclick=()=>removeClub(idx);
    el.appendChild(row);
  });
}

function addClub(){
  const input=document.getElementById("newClubInput");
  const name=input.value.trim();
  if(!name)return;
  if(clubs.some(c=>c.toLowerCase()===name.toLowerCase())){
    alert("同じ名前のクラブがあります"); return;
  }
  clubs.push(name);
  if(!state.selectedClub) state.selectedClub=name;
  input.value="";
  save(); renderAll();
}

function removeClub(idx){
  const name=clubs[idx];
  if(!confirm(`${name} を使用クラブから削除しますか？\n過去の記録は残ります。`)) return;
  clubs.splice(idx,1);
  if(state.selectedClub===name) state.selectedClub=clubs[0]||"";
  save(); renderAll();
}

function moveClub(idx,dir){
  const to=idx+dir;
  if(to<0||to>=clubs.length)return;
  [clubs[idx],clubs[to]]=[clubs[to],clubs[idx]];
  save(); renderAll();
}

function setTarget(v){
  const n=Math.max(1,Math.min(999,parseInt(v||100,10)));
  state.target=n;
  save(); renderProgress(); renderReport();
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
}

function renderAll(){
  renderTabs(); renderSelectedClub(); renderProgress(); renderStats(); renderReport(); renderHistory(); renderClubManager();
  document.getElementById("memo").value=state.memo||"";
}

document.getElementById("memo").addEventListener("input",e=>{
  state.memo=e.target.value; save(); renderReport();
});
document.getElementById("targetInput").addEventListener("change",e=>setTarget(e.target.value));
document.querySelectorAll(".targetQuick").forEach(b=>b.onclick=()=>setTarget(b.dataset.target));

document.getElementById("openClubManagerBtn").onclick=()=>{
  document.getElementById("clubManager").classList.remove("hidden");
  document.getElementById("clubManager").scrollIntoView({behavior:"smooth",block:"start"});
};
document.getElementById("closeClubManagerBtn").onclick=()=>document.getElementById("clubManager").classList.add("hidden");
document.getElementById("addClubBtn").onclick=addClub;
document.getElementById("newClubInput").addEventListener("keydown",e=>{if(e.key==="Enter")addClub();});

document.getElementById("undoBtn").onclick=()=>{state.shots.pop();save();renderAll();}
document.getElementById("resetTodayBtn").onclick=()=>{
  if(confirm("今日の記録をリセットしますか？")){state.shots=[];state.memo="";save();renderAll();}
};
document.getElementById("refreshReportBtn").onclick=renderReport;
document.getElementById("copyBtn").onclick=async()=>{
  await navigator.clipboard.writeText(buildReport());
  alert("コピーしました");
};
document.getElementById("shareBtn").onclick=async()=>{
  const text=buildReport();
  if(navigator.share){await navigator.share({title:"ゴルフ練習記録",text});}
  else{await navigator.clipboard.writeText(text);alert("共有機能がないためコピーしました");}
};
document.getElementById("saveSessionBtn").onclick=()=>{
  if(!state.shots.length){alert("記録がありません");return}
  history.push({
    date:new Date().toLocaleString("ja-JP"),
    total:state.shots.length,target:state.target,memo:state.memo,report:buildReport()
  });
  saveHistory(); alert("練習履歴に保存しました"); renderHistory();
};
document.getElementById("clearHistoryBtn").onclick=()=>{
  if(confirm("すべての履歴を削除しますか？")){history=[];saveHistory();renderHistory();}
};

document.querySelectorAll(".navBtn").forEach(btn=>{
  btn.onclick=()=>{
    ["practiceView","reportView","historyView"].forEach(id=>document.getElementById(id).classList.add("hidden"));
    document.getElementById(btn.dataset.view).classList.remove("hidden");
    document.querySelectorAll(".navBtn").forEach(x=>x.classList.remove("primary"));
    btn.classList.add("primary");
    if(btn.dataset.view==="reportView")renderReport();
    if(btn.dataset.view==="historyView")renderHistory();
  };
});

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));
}
renderAll();
</script>
</body>
</html>
